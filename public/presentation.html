            `).join('')}
          </div>
          <p class="text-center text-xs text-stone-500">Kalkulasi komisi agen (2.5%) terhitung otomatis secara proporsional sesuai pergerakan tahap deal.</p>
        `;
      } else if (s.layout === 'conclusion') {
        html += `
          <div class="flex-1 flex flex-col justify-center items-center text-center space-y-6 my-auto">
            <span class="text-4xl">🚀</span>
            <div>
              <h2 class="text-3xl md:text-4xl font-extrabold text-stone-900 tracking-tight">${s.title}</h2>
              <p class="text-sm md:text-base text-stone-600 mt-2 max-w-xl mx-auto">${s.subtitle}</p>
            </div>
            
            <div class="p-5 bg-gradient-to-r from-emerald-800 to-teal-800 text-white rounded-3xl shadow-lg shadow-emerald-800/20 max-w-lg">
              <p class="text-lg md:text-xl font-bold font-mono tracking-tight">${s.callout}</p>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-4 text-xs text-stone-600">
              <div class="px-4 py-2 bg-white border border-stone-200 rounded-xl">
                <span>Presenter: <strong>${s.presenter.name}</strong> (${s.presenter.npm})</span>
              </div>
              <a href="${s.demoLink}" target="_blank" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl shadow-xs transition-all">
                Buka Live Demo Website ↗
              </a>
            </div>
          </div>
        `;
      }

      html += `
        <!-- Slide Bottom Footer Brand -->
        <div class="pt-3 border-t border-stone-200/80 flex items-center justify-between text-[11px] text-stone-400 font-mono">
          <span>Agent Mate CRM • Rosa Nursyamsiah</span>
          <span>Halaman ${index + 1} dari ${slides.length}</span>
        </div>
      `;

      container.innerHTML = html;

      // Update indicators
      const indContainer = document.getElementById('slideIndicators');
      indContainer.innerHTML = slides.map((_, i) => `
        <button onclick="goToSlide(${i})" class="w-2.5 h-2.5 rounded-full transition-all cursor-pointer ${i === index ? 'bg-emerald-500 w-6' : 'bg-stone-700 hover:bg-stone-500'}"></button>
      `).join('');

      // Update button state
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('prevBtn').style.opacity = index === 0 ? '0.4' : '1';
      document.getElementById('nextBtn').textContent = index === slides.length - 1 ? 'Selesai 🏁' : 'Selanjutnya →';
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function goToSlide(i) {
      currentSlide = i;
      renderSlide(currentSlide);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>
